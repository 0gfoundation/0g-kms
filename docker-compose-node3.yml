services:
  kms:
    image: eliza-registry-vpc.ap-southeast-1.cr.aliyuncs.com/eliza/0g-kms:latest
    command: ["kms-server", "/config/kms.toml"]
    ports:
      - "9091:9090"   # HTTP /app-key   (host 9091 → container bind 9090)
      - "9092:9092"   # inter-node gRPC (host 9092 → container grpc_bind 9092)
    volumes:
      - ./kms-node3.toml:/config/kms.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
