services:
  kms:
    image: eliza-registry-vpc.ap-southeast-1.cr.aliyuncs.com/eliza/0g-kms:latest
    command: ["kms-server", "/config/kms.toml"]
    ports:
      - "8090:8080"
      - "9092:9090"
    volumes:
      - ./kms-node3.toml:/config/kms.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
