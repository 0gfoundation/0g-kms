syntax = "proto3";
package kms_cluster;

import "google/protobuf/empty.proto";

// ─── Inter-node KMS protocol ──────────────────────────────────────────────────
//
// Auth is carried in gRPC metadata on every call:
//   "signature" : recoverable secp256k1 ECDSA signature (hex, 65 bytes)
//                 over "kms:{method}:{timestamp}"
//   "timestamp" : Unix seconds (string), rejected if |now - timestamp| > 300
//
// Responder auth flow:
//   1. Recover caller's public key + eth address from signature.
//   2. Call getNodeList(own_app_id) on-chain; verify caller address is in the list.
//   3. ECIES-encrypt response with caller's recovered secp256k1 public key.

service KmsCluster {
  // Threshold-BLS DPRF: return this node's partial evaluation f(i)·H(msg) for the
  // requested (app_id, material), encrypted for the caller. The coordinator combines
  // partials from ≥ threshold nodes (in-group Lagrange) into the app key WITHOUT ever
  // reconstructing the master. msg = bind(app_id, material) (see crypto::dprf_message).
  rpc GetDprfPartial(DprfPartialRequest) returns (EncryptedPartial);

  // Return this node's own shard, encrypted for the caller.
  rpc GetShardContribution(google.protobuf.Empty) returns (EncryptedShard);

  // Assign and return the shard that belongs to the caller.
  //   - Init:     start node holds all N shards; assigns one based on
  //               caller's position in nodeList.
  //   - Recovery: coordinator collects shards from all healthy peers,
  //               reconstructs masterKey, identifies the missing shard_index,
  //               generates the missing shard and returns it to the caller.
  rpc RequestShard(google.protobuf.Empty) returns (EncryptedShard);

  // Gossip: exchange membership information.
  // Caller sends its own NodeInfo; responder updates its peer table and
  // returns its full known member list.  Acts as both discovery and heartbeat.
  rpc Gossip(GossipRequest) returns (GossipResponse);

  // Threshold-BLS DKG / resharing transport (push model). Each participant sends its
  // round-N output to every other participant; the recipient buffers by
  // (session_id, round, from_index) and advances to round N+1 once it has all expected
  // participants' round-N messages. Genesis (no dealer) and lost-share recovery (reshare)
  // run the same gennaro rounds — session_id namespaces the instance.
  rpc DkgRound(DkgRoundMsg) returns (DkgRoundAck);

  // Reshare trigger: a recovering node (which lost its share) asks a live committee member
  // to participate in a reshare session as a dealer, contributing its existing share so the
  // master is preserved. The recipient runs the session in the background and replaces its
  // own share with the refreshed one. Idempotent per session_id.
  rpc StartReshare(ReshareRequest) returns (ReshareAck);
}

// ─── DPRF messages ────────────────────────────────────────────────────────────

message DprfPartialRequest {
  string app_id   = 1;  // namespace (must match the responder's on-chain app_id)
  bytes  material = 2;   // caller-supplied derivation material (opaque to the KMS)
}

message EncryptedPartial {
  bytes  ciphertext  = 1;  // ECIES(partial signature bytes) for the caller
  uint32 shard_index = 2;  // source node's shard index (for dedup at the coordinator)
  uint64 epoch       = 3;  // polynomial epoch of the share that produced this partial;
                           // the coordinator only combines partials of a single epoch
  bytes  signature   = 4;  // responder's recoverable secp256k1 signature (65 bytes) over
                           // bind("GetDprfPartial", caller_addr, shard_index, epoch, ciphertext).
                           // ECIES gives confidentiality only; this proves origin + integrity so
                           // an active attacker cannot substitute a ciphertext the caller would
                           // decrypt into an attacker-chosen value. Signer must be an on-chain node.
}

// ─── Shard messages ───────────────────────────────────────────────────────────

message EncryptedShard {
  bytes  ciphertext  = 1;
  uint32 shard_index = 2;
  bytes  signature   = 3;  // responder's recoverable secp256k1 signature (65 bytes) over
                           // bind(method, caller_addr, shard_index, ciphertext); same origin +
                           // integrity guarantee as EncryptedPartial.signature.
}

// ─── Gossip messages ──────────────────────────────────────────────────────────

message NodeInfo {
  string grpc_url = 1;  // e.g. "http://1.2.3.4:9092"
  string eth_addr = 2;  // lowercase hex, no 0x prefix (20 bytes = 40 chars)
  bytes  pubkey   = 3;  // uncompressed secp256k1 pubkey (65 bytes) for DKG p2p ECIES; may be empty
  uint64 epoch    = 4;  // sender's current polynomial epoch (0 = no share yet); lets every
                        // node agree on the cluster epoch and reshares pick a monotonic next one
  bytes  group_pubkey = 5;  // sender's view of the cluster's group public key (empty = none yet).
                        // MONITORING ONLY — never used to make a decision, only compared, so a
                        // node can tell on its own that the cluster has forked into two masters
                        // instead of an operator diffing logs across every host. Empty from a
                        // node that predates this field, which reads as "unknown", not "differs".
}

message GossipRequest {
  NodeInfo self_info = 1;
}

message GossipResponse {
  repeated NodeInfo peers = 1;
}

// ─── DKG / resharing messages ───────────────────────────────────────────────────

message DkgRoundMsg {
  string session_id = 1;  // "genesis:{app_id}" | "reshare:{app_id}:{epoch}"
  uint32 round      = 2;  // 1..5
  uint32 from_index = 3;  // sender's 1-based nodeList participant id
  bytes  broadcast  = 4;  // serde_bare(RoundNBroadcastData) — broadcast to all participants
  bytes  p2p        = 5;  // ECIES(serde_bare(Round1P2PData)) for THIS recipient (round 1 only)
}

message DkgRoundAck {}

message ReshareRequest {
  string session_id     = 1;  // "reshare:{app_id}:{epoch}:{nonce}"
  uint32 recovering_id  = 2;  // participant id of the node being recovered
  repeated uint32 dealer_ids = 3;  // ids of the dealers (survivors contributing shares), in order
  uint64 epoch          = 4;  // new polynomial epoch every participant stamps its refreshed
                              // share with (chosen by the trigger as known_epoch + 1)
}

message ReshareAck {}
