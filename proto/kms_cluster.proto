syntax = "proto3";
package kms_cluster;

import "google/protobuf/empty.proto";

// ─── Inter-node KMS protocol ──────────────────────────────────────────────────
//
// Auth is carried in gRPC metadata on every call:
//   "signature" : recoverable secp256k1 ECDSA signature (hex, 65 bytes)
//                 over "kms:{method}:{timestamp}"
//   "timestamp" : Unix seconds (string), rejected if |now - timestamp| > 300
//
// Responder auth flow:
//   1. Recover caller's public key + eth address from signature.
//   2. Call getNodeList(own_app_id) on-chain; verify caller address is in the list.
//   3. ECIES-encrypt response with caller's recovered secp256k1 public key.

service KmsCluster {
  // Threshold-BLS DPRF: return this node's partial evaluation f(i)·H(msg) for the
  // requested (app_id, material), encrypted for the caller. The coordinator combines
  // partials from ≥ threshold nodes (in-group Lagrange) into the app key WITHOUT ever
  // reconstructing the master. msg = bind(app_id, material) (see crypto::dprf_message).
  rpc GetDprfPartial(DprfPartialRequest) returns (EncryptedPartial);

  // Return this node's own shard, encrypted for the caller.
  rpc GetShardContribution(google.protobuf.Empty) returns (EncryptedShard);

  // Assign and return the shard that belongs to the caller.
  //   - Init:     start node holds all N shards; assigns one based on
  //               caller's position in nodeList.
  //   - Recovery: coordinator collects shards from all healthy peers,
  //               reconstructs masterKey, identifies the missing shard_index,
  //               generates the missing shard and returns it to the caller.
  rpc RequestShard(google.protobuf.Empty) returns (EncryptedShard);

  // Gossip: exchange membership information.
  // Caller sends its own NodeInfo; responder updates its peer table and
  // returns its full known member list.  Acts as both discovery and heartbeat.
  rpc Gossip(GossipRequest) returns (GossipResponse);
}

// ─── DPRF messages ────────────────────────────────────────────────────────────

message DprfPartialRequest {
  string app_id   = 1;  // namespace (must match the responder's on-chain app_id)
  bytes  material = 2;   // caller-supplied derivation material (opaque to the KMS)
}

message EncryptedPartial {
  bytes  ciphertext  = 1;  // ECIES(partial signature bytes) for the caller
  uint32 shard_index = 2;  // source node's shard index (for dedup at the coordinator)
}

// ─── Shard messages ───────────────────────────────────────────────────────────

message EncryptedShard {
  bytes  ciphertext  = 1;
  uint32 shard_index = 2;
}

// ─── Gossip messages ──────────────────────────────────────────────────────────

message NodeInfo {
  string grpc_url = 1;  // e.g. "http://1.2.3.4:9092"
  string eth_addr = 2;  // lowercase hex, no 0x prefix (20 bytes = 40 chars)
}

message GossipRequest {
  NodeInfo self_info = 1;
}

message GossipResponse {
  repeated NodeInfo peers = 1;
}
