[package]
name = "kms"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kms-server"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = "0.7"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.4", features = ["util"] }

# gRPC (inter-node communication)
tonic = "0.11"
prost = "0.12"

# Async utilities
futures = "0.3"

# Crypto
k256 = { version = "0.13", features = ["ecdsa", "std"] }
elliptic-curve = { version = "0.13", features = ["ff"] }
generic-array = "0.14"
typenum = "1"
sha2 = "0.10"
hkdf = "0.12"
sha3 = "0.10"
# ECIES encryption compatible with eciesjs
# Config 1: secp256k1 + AES-256-GCM (OpenSSL, best performance) ← CURRENT
ecies = { version = "0.2", features = ["std"] }
# Config 2: secp256k1 + XChaCha20-Poly1305 (Pure Rust)
# ecies = { version = "0.2", default-features = false, features = ["xchacha20"] }
# Config 3: curve25519 (x25519) + AES-256-GCM (OpenSSL)
# ecies = { version = "0.2", features = ["std", "x25519"] }
# Config 4: curve25519 (x25519) + XChaCha20-Poly1305 (Pure Rust)
# ecies = { version = "0.2", default-features = false, features = ["x25519", "xchacha20"] }
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# Threshold BLS (DPRF key derivation) — IETF BLS12-381, blst backend.
# Pinned exactly (guardrail #1): we own the small slice of this crate we depend on.
# Provides genesis SecretKey::split, per-node SecretKeyShare::sign (partial = f(i)·H(msg)),
# and Signature::from_shares (in-group Lagrange combine — never reconstructs the master).
blsful = "=3.1.0"
# Shamir/VSS primitives (share repair on the recovery path). Aligned with blsful's vsss-rs;
# also re-exported as `blsful::vsss_rs` to avoid version skew.
vsss-rs = "=5.4.0"
# Distributed key generation + proactive resharing (Family A: mikelodder7 stack, same
# lineage as blsful/vsss-rs). Produces scalar shares that bridge into blsful SecretKeyShare.
# Genesis DKG (no dealer single point) + lost-share recovery/refresh via resharing.
gennaro-dkg = "0.8.0"
# blsful's blst backend curve types (Scalar/G1Projective), named directly so we can bridge
# a gennaro scalar share into a blsful SecretKeyShare. Unifies with blsful's blstrs_plus.
blstrs_plus = "0.8"
# Curve traits (Group/GroupEncoding/PrimeField) used to drive gennaro over blstrs_plus.
group = "0.13"
ff = "0.13"
# Canonical serialization of gennaro DKG round messages for the wire (same codec blsful uses).
serde_bare = "0.5"

# On-chain lookup (ethers for reading contract state)
ethers = { version = "2.0", default-features = false, features = ["rustls", "abigen"] }

# Config & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling & logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Daily-rotating log files with a hard retention cap (KMS_LOG_DIR). Needed so a log shipper can
# read the node's log from a shared volume instead of the host docker socket.
tracing-appender = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
# `examples/dprf_client.rs` only (test tooling). Not compiled into the release binary,
# so it has zero impact on the production image (`cargo build --release --bin kms-server`).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[build-dependencies]
tonic-build = "0.11"

# ── Dependency un-rot ──────────────────────────────────────────────────────────
# gennaro-dkg 0.8.0 transitively needs `uint-zigzag 0.2.1`, which pins `core2 ^0.4` —
# and the only version in that range (core2 0.4.0) is YANKED (and absent on the
# rsproxy.cn mirror). We replace uint-zigzag with a std-only in-tree fork that drops
# core2 (uses std::io); version kept at 0.2.1 so it satisfies the `^0.2.1` requirement.
# Only 3 non-algorithmic edits vs upstream; verified byte-identical behaviour + core2
# fully removed from the lockfile. See vendor/uint-zigzag/.
[patch.crates-io]
uint-zigzag = { path = "vendor/uint-zigzag" }
