services:
  kms:
    image: eliza-registry-vpc.ap-southeast-1.cr.aliyuncs.com/eliza/0g-kms:latest
    command: ["kms-server", "/config/kms.toml"]
    ports:
      - "9090:9090"
      - "9092:9092"
    volumes:
      - ./kms.toml:/config/kms.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
