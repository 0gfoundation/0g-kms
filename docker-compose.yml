# 0g-kms node deployment — one node per host. Each host runs this unchanged; the node's
# identity lives in ITS OWN kms.toml (self_url / seeds / sealed_share_path differ per node,
# so the config content — not this file — is what varies between hosts).
#
#   docker compose up -d
#
# Put this host's config in ./kms.toml (see the template kms.toml in this repo). The real
# per-node values for a live cluster live in the ops repo (0g-tapp-ops/kms/dev/kms-nodeN-dev.toml).
#
# For a self-contained multi-node LOCAL TEST (all nodes on one host, built from source, mock
# chain + mock TEE), use test/local-cluster/docker-compose.test.yml instead.
services:
  kms:
    # Registry is per-environment. The dev cluster pulls from GCP Artifact Registry:
    image: us-central1-docker.pkg.dev/g-devops/zg-kms/0g-kms:dev
    # Always re-pull on up/restart so a freshly-pushed tag is actually used (compose would
    # otherwise reuse the cached image and silently keep running the old code).
    pull_policy: always
    command: ["kms-server", "/config/kms.toml"]
    ports:
      - "9090:9090"   # HTTP: /app-key, /refresh, /sealed-share, /peers, /health, /ready, /metrics
      - "9092:9092"   # inter-node gRPC (gossip + DKG); = self_url port
    # Probes /health (process is up), NOT /ready (holds a share). A node waiting to rejoin is
    # doing exactly what it should, and restarting it there would throw away the progress it has
    # made and re-enter the settle window. Read /ready from a load balancer or a scrape instead,
    # where "not ready" means "send derives elsewhere" rather than "kill it".
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./kms.toml:/config/kms.toml:ro
      # tapp-server's Unix socket — see [tapp] tapp_socket in kms.toml. tapp-server serves
      # gRPC on this socket in addition to TCP, so mounting it lets the KMS reach the host
      # tapp-server via local IPC (no extra_hosts / host.docker.internal needed). Requires the
      # host tapp-server to have [server] unix_socket_path set.
      - /run/tapp/tapp.sock:/run/tapp/tapp.sock
      # Durable volume for the auto-persisted sealed share (see [cluster] sealed_share_path).
      # On the tapp CVM /data is the persistent disk, so the blob survives container restart /
      # reboot and a restart auto-reloads from it (no rejoin). The blob is ECIES-sealed to this
      # node's TEE key, so a plaintext file at rest is safe.
      - /data/kms:/var/lib/kms
    # TCP fallback — ONLY if kms.toml uses tapp_ip/tapp_port instead of tapp_socket:
    #   extra_hosts:
    #     - "host.docker.internal:host-gateway"
    restart: unless-stopped
