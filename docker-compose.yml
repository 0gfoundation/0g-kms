# 0g-kms node deployment — one node per host. Each host runs this unchanged; the node's
# identity lives in ITS OWN kms.toml (self_url / seeds differ per node, so the config content
# — not this file — is what varies between hosts).
#
#   docker compose up -d
#
# Put this host's config in ./kms.toml. Reference configs for the other nodes are checked in
# as kms-node2.toml / kms-node3.toml — copy the right one to kms.toml on each host.
#
# For a self-contained multi-node LOCAL TEST (all nodes on one host, built from source, mock
# chain + mock TEE), use test/local-cluster/docker-compose.test.yml instead.
services:
  kms:
    image: eliza-registry-vpc.ap-southeast-1.cr.aliyuncs.com/eliza/0g-kms:latest
    # Always re-pull on up/restart so a freshly-pushed tag is actually used (compose would
    # otherwise reuse the cached image and silently keep running the old code).
    pull_policy: always
    command: ["kms-server", "/config/kms.toml"]
    ports:
      - "9090:9090"   # HTTP: /app-key, /refresh
      - "9092:9092"   # inter-node gRPC
    volumes:
      - ./kms.toml:/config/kms.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
