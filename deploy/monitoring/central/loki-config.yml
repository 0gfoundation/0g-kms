auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # The service record is low-volume (one line per derive) but must not be lost in a burst.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  # Keep 90 days, matching Prometheus, so a post-incident question about which nodes served a
  # request can still be answered months later.
  retention_period: 2160h
  # Agents lift the event timestamp out of the JSON, so allow a little slack for a backlog
  # being flushed after a restart or partition.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
